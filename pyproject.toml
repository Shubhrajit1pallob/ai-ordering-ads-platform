[project]
name = "local-store-platform"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.43.120",
    "moto[cognitoidp,dynamodb,events,s3,sns,sqs,stepfunctions]>=5.2.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["services/tests"]
pythonpath = ["services"]
